# Run the test suite, including a strict build of the documentation,
# on every push and pull request.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Graphviz's dot is needed by the diagram tests and the docs build;
      # without it those tests would be skipped rather than run.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install
        run: pip install -e ".[test]"

      - name: Test
        run: pytest -ra
